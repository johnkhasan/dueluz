# duel.hsbch.uz -> dueluz-web:3000
#
# Appended to /srv/hsbch/nginx.conf, which is the single config mounted into
# the shared hsbch-nginx-1 container. Port 80 is already handled by the
# catch-all server block there: it serves the ACME challenge from
# /var/www/certbot and redirects everything else to https.
server {
    listen 443 ssl;
    http2 on;
    server_name duel.hsbch.uz;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Duel images are up to 5 MB; the app rejects anything larger itself.
    client_max_body_size 8m;

    # Resolved at request time through Docker's embedded DNS, so the app
    # container can be rebuilt and replaced without reloading nginx.
    resolver 127.0.0.11 valid=10s;

    access_log /var/log/nginx/duel.access.log;
    error_log  /var/log/nginx/duel.error.log;

    location / {
        set $upstream_duel dueluz-web:3000;
        proxy_pass http://$upstream_duel$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The app hashes this for abuse control and trusts it as given, so it
        # must be the real peer address and must not be appended to.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Uploaded images come straight off the shared volume rather than through
    # Node. The app serves them itself as well, so this is purely an
    # optimisation and the site stays correct if the mount is ever missing.
    location /uploads/ {
        alias /var/www/duel-uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri @duel_app;
    }

    location @duel_app {
        set $upstream_duel dueluz-web:3000;
        proxy_pass http://$upstream_duel$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js build assets are content-hashed.
    location /_next/static/ {
        set $upstream_duel dueluz-web:3000;
        proxy_pass http://$upstream_duel$request_uri;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
